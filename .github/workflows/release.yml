name: Release Build

on:
  push:
    tags:
      - 'v*'
  # 需要在不打 tag 的情况下验证打包流程时手动触发（手动触发只出产物，不发 Release）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.0）'
        required: true
        default: 'v0.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # tag 触发取 tag 名（v1.0.0），手动触发取输入值；build.sh 会自行去掉 v 前缀
  PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.arch }} packages
    runs-on: ubuntu-latest
    strategy:
      # 单架构失败不取消另一架构，尽量留下可用的安装包
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 跟随 go.mod 的版本声明，避免工作流与代码要求脱节
          go-version-file: subsonic-adapter-go/go.mod
          cache: true
          cache-dependency-path: subsonic-adapter-go/go.sum

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # dpkg-dev 提供 dpkg-deb，rpm 提供 rpmbuild
          sudo apt-get install -y dpkg-dev rpm

      - name: Build packages
        working-directory: subsonic-adapter-go
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          chmod +x packaging/build.sh
          # 构建 deb 和 rpm 包
          ./packaging/build.sh all

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: subsonic-adapter-${{ matrix.arch }}-deb
          path: subsonic-adapter-go/dist/*.deb
          if-no-files-found: error

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: subsonic-adapter-${{ matrix.arch }}-rpm
          path: subsonic-adapter-go/dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    # 只有 tag 推送才发 Release；手动触发只保留构建产物
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.deb ./*.rpm > SHA256SUMS.txt && cat SHA256SUMS.txt

      # GitHub 自动生成的 Release 说明只统计已合并的 PR 与新贡献者，
      # 本仓库直接向 main 推送提交，生成结果为空。改为从 CHANGELOG.md
      # 取出当前版本小节，并补充安装说明。
      - name: Compose release notes
        env:
          VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          set -eu
          VER="${VERSION#v}"
          NOTES=release-notes.md

          BODY=""
          if [ -f CHANGELOG.md ]; then
            # 取出 "## [vX.Y.Z]" 到下一个 "## " 之前的内容；用 index() 匹配，
            # 避免在 sh/awk 里反复处理正则转义。
            BODY=$(awk -v ver="$VER" '
              /^##[[:space:]]/ {
                if (found) exit
                if (index($0, "[" ver "]") > 0 || index($0, "[v" ver "]") > 0) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md)
          fi

          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY="_该版本未在 CHANGELOG.md 中登记，详见仓库提交记录。_"
          fi

          {
            # 去掉 CHANGELOG 小节前后多余空行，避免正文开头是空行
            printf '%s\n\n' "$BODY" | sed -e 's/[[:space:]]*$//' -e '/./,$!d'
            cat <<EOF
          ## 安装

          ### Debian / Ubuntu

          \`\`\`bash
          sudo dpkg -i subsonic-adapter_${VER}_amd64.deb    # 或 _arm64.deb
          \`\`\`

          ### Fedora / RHEL

          \`\`\`bash
          sudo rpm -i subsonic-adapter-${VER}-1.x86_64.rpm  # 或 .aarch64.rpm
          \`\`\`

          校验下载文件：

          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          ## 包说明

          | 文件 | 适用平台 |
          |---|---|
          | \`*_amd64.deb\` / \`*.x86_64.rpm\` | Intel / AMD 处理器 |
          | \`*_arm64.deb\` / \`*.aarch64.rpm\` | ARM64（树莓派、Apple Silicon 虚拟机等） |

          安装后：应用菜单「Subsonic 适配器」，或命令行运行 \`subsonic-adapter-go\`。
          配置项与自启方式见 [packaging/README.md](https://github.com/${{ github.repository }}/blob/main/subsonic-adapter-go/packaging/README.md)。
          EOF
          } >"$NOTES"

          cat "$NOTES"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: release-notes.md
          # 形如 v1.0.0-rc1 的预发布 tag 自动标记为 prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
